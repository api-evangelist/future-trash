name: Future Trash
description: >-
  Future Trash is a Los Angeles-based independent, multidisciplinary creative
  game studio and the developer behind FOAD, a user-generated-content (UGC)
  native video game franchise. Founded around 2022, the team first built a
  vertical-slice MVP of FOAD in Unreal Engine 5 and released it in early access
  on Steam. After Epic Games launched Unreal Editor for Fortnite (UEFN) in 2023,
  the studio pivoted to building FOAD experiences natively inside Fortnite's UGC
  ecosystem, spanning MOBA, tycoon, and combat modes, while planning to resume
  the standalone UE5 core game. Future Trash raised a $5M seed round in September
  2024 led by TIRTA Ventures with participation from General Catalyst. This
  profile was surfaced from General Catalyst's portfolio and added to the API
  Evangelist network; Future Trash is a game studio and publishes no public
  developer API surface.
